# Card Number Passwords - configuracao de StarChips
#
# Passwords de outros mods tem prioridade; o ID e um alias de 8 digitos.
# Exemplos: carta 722 = 00000722; carta 1500 = 00001500.
#
# Use -1 para manter o preco carregado (incluindo outros mods) das cartas 1-722.
# Para cartas adicionadas por mods nao existe preco original; nesse caso
# added_cards_default e usado.

[defaults]
stock_cards_default = -1
added_cards_default = 999999

# Valores especificos por ID. Remova o # e altere/adicone linhas.
# O intervalo aceito e 0..999999 StarChips.
[cards]
# Exemplo - Numero da carta = preco em estrelas
# 1 = 100
# 722 = 500
# 723 = 1000
# 1500 = 2500
# 20000 = 999999

722 = 10